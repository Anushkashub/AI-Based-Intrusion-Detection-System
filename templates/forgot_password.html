<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-IDS — Password Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        body {
            background-color: #030611;
            background-image:
                linear-gradient(to right, rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 40%, rgba(0, 195, 255, 0.12) 0%, transparent 50%);
            background-size: 38px 38px, 38px 38px, 100% 100%;
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .aiids-card {
            background: #081122;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 16px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 180, 255, 0.08);
        }
        input.custom-input {
            background-color: #060d19 !important;
            border: 1px solid #16243b !important;
            color: #ffffff !important;
        }
        input.custom-input:focus {
            outline: none !important;
            border-color: #00e5c9 !important;
            box-shadow: 0 0 0 1px #00e5c9, 0 0 12px rgba(0, 229, 201, 0.25) !important;
        }
        .btn-radiant-cyan {
            background: #00e5c9;
            color: #030712;
            font-weight: 800;
            box-shadow: 0 4px 22px rgba(0, 229, 201, 0.55);
        }
        .btn-radiant-cyan:hover {
            background: #1affdc;
            box-shadow: 0 6px 28px rgba(0, 229, 201, 0.75);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="p-4 select-none">
    <div class="w-full max-w-[420px]">
        <div class="aiids-card p-8 space-y-6">
            <div class="text-left space-y-1">
                <div class="flex items-center gap-2 mb-2 text-[#00e5c9]">
                    <i data-lucide="key-round" class="w-5 h-5"></i>
                    <span class="text-xs font-mono font-bold uppercase tracking-wider">Credential Recovery</span>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Reset Password</h2>
                <p class="text-xs text-slate-400">Enter your enterprise username or registered email address to receive recovery instructions.</p>
            </div>
            <form id="recoveryForm" onsubmit="handleRecovery(event)" class="space-y-4">
                <div class="space-y-1 text-left">
                    <label class="text-xs font-medium text-slate-300">Enterprise Username / Email</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="recoveryIdentity" required placeholder="admin@enterprise.local" class="custom-input w-full pl-10 pr-4 py-2.5 rounded-lg text-xs font-medium placeholder-slate-500">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-radiant-cyan w-full py-2.5 rounded-lg text-xs tracking-wider uppercase mt-2 font-bold">
                    Send Recovery Instructions
                </button>
            </form>
            <div id="successNotice" class="hidden p-3.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs space-y-1">
                <div class="font-bold flex items-center gap-1.5">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>Recovery Request Dispatched</span>
                </div>
                <p class="text-[11px] text-slate-300">A secure password reset link has been sent to the associated enterprise inbox.</p>
            </div>
            <div class="pt-4 border-t border-slate-800/80 text-center">
                <a href="/login" class="inline-flex items-center gap-2 text-xs text-[#00e5c9] hover:underline font-medium">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Back to Login Console</span>
                </a>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        function handleRecovery(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Processing...';
            btn.disabled = true;
            setTimeout(() => {
                document.getElementById('recoveryForm').classList.add('hidden');
                document.getElementById('successNotice').classList.remove('hidden');
                lucide.createIcons();
            }, 800);
        }
    </script>
</body>
</html>
